<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: #f1f5f9;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }

        .delete {
            background: #ef4444;
            padding: 5px 10px;
        }

        .delete:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script>
        function addTask() {

            const input = document.getElementById("taskInput");
            const task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li");

            li.innerHTML = `
                <span>${task}</span>
                <button class="delete" onclick="deleteTask(this)">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
